[accessibility]
ui_scale = 1.05

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "on_primary"
center = [ "clock", "notifications" ]
end = [ "sysmon", "network", "tray", "bluetooth", "volume", "brightness", "caffeine", "control-center", "session" ]
font_family = "Fira Sans"
margin_ends = 0
radius = 0
radius_bottom_left = 12
radius_bottom_right = 12
start = [ "launcher", "workspaces", "media" ]
thickness = 28

[dock]
pinned = [ "chromium" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[osd]
position = "top_right"

    [osd.kinds]
    volume_input = false
    volume_output = false

[shell]
font_family = "Fira Sans"

[theme]
builtin = "Tokyo-Night"
community_palette = "Cream Autumn"
source = "community"

    [theme.templates]
    community_ids = [ "heroiclauncher" ]

[wallpaper]
directory = "/home/camilo/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/camilo/Pictures/Wallpapers/wallhaven-zmo6jj.jpg"

    [wallpaper.last]
    path = "/home/camilo/Pictures/Wallpapers/wallhaven-zmo6jj.jpg"

[widget.media]
hide_when_no_media = true

[widget.sysmon]
show_value = true
visualization = "none"
